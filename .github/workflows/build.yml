# Проверка и сборка приложения «Маршрут».
#
# 1. test     — flutter analyze, модульные и виджет-тесты, интеграционный тест
#               настоящего приложения (Linux, виртуальный экран xvfb).
# 2. android  — релизный APK (артефакт marshrut-android-apk).
# 3. windows  — релизная сборка для Windows (артефакт marshrut-windows).
# 4. ios      — сборка для iPhone без подписи (артефакт marshrut-ios, файл
#               marshrut-ios.ipa). Подпись делает Sideloadly при установке
#               на телефон бесплатным Apple ID (docs/Установка_на_iPhone.md).
# 5. server   — сервер API для Windows (артефакт marshrut-server-windows):
#               программа marshrut_server.exe, библиотека SQLite, каталог тем
#               и файл «Запустить сервер.bat» (docs/Сервер_API.md).
#
# Готовые файлы скачиваются на странице запуска: вкладка Actions → запуск →
# раздел Artifacts. Когда на странице Releases публикуется новый релиз
# (например, с тегом v1.1.0), та же сборка прикладывает APK, архив для
# Windows, IPA для iPhone и архив сервера к этому релизу, и их можно
# скачать без входа в GitHub.
name: Сборка и тесты

on:
  push:
    branches: [main, master, 'claude/**']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib bin test integration_test tool
      - name: Статический анализ
        run: flutter analyze
      - name: Модульные и виджет-тесты
        run: flutter test
      - name: Зависимости для сборки под Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Интеграционный тест (настоящее приложение)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" flutter test integration_test -d linux

  android:
    name: APK для Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Сборка релизного APK
        run: flutter build apk --release
      - name: Переименование
        run: cp build/app/outputs/flutter-apk/app-release.apk marshrut-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: marshrut-android-apk
          path: marshrut-release.apk
          if-no-files-found: error

  windows:
    name: Сборка для Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Сборка релизной версии
        run: flutter build windows --release
      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath marshrut-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: marshrut-windows
          path: marshrut-windows.zip
          if-no-files-found: error

  ios:
    name: Сборка для iPhone
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Сборка релизной версии без подписи
        run: flutter build ios --release --no-codesign
      - name: Упаковка в IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry marshrut-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: marshrut-ios
          path: marshrut-ios.ipa
          if-no-files-found: error

  server:
    name: Сервер API для Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Сборка программы-сервера
        run: dart build cli -t bin/marshrut_server.dart -o build/server
      - name: Каталог тем, файл запуска и архив
        shell: pwsh
        run: |
          Copy-Item -Recurse assets/catalog build/server/bundle/catalog
          Copy-Item 'tool/server/Запустить сервер.bat' build/server/bundle/
          Compress-Archive -Path build/server/bundle/* -DestinationPath marshrut-server-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: marshrut-server-windows
          path: marshrut-server-windows.zip
          if-no-files-found: error

  release:
    name: Файлы для релиза
    if: github.event_name == 'release'
    needs: [android, windows, ios, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            marshrut-release.apk
            marshrut-windows.zip
            marshrut-ios.ipa
            marshrut-server-windows.zip
